$kind: http-request
url: "{{baseUrl}}/api/directores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "Director prueba {{tag}}",
      "estado": "Activo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("directorId", pm.response.json().datos.id);
    language: text/javascript
order: 6000
