$kind: http-request
url: "{{baseUrl}}/api/tipos/{{nuevoTipoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Documental {{tag}}",
      "descripcion": "Producciones informativas"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 12000
