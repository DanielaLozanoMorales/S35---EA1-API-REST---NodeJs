$kind: http-request
url: "{{baseUrl}}/api/media"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "serial": "PEL-{{tag}}",
      "titulo": "Película demostrativa",
      "sinopsis": "Trama ficticia para pruebas de la API",
      "url_pelicula": "https://example.com/videos/{{tag}}",
      "portada": "https://example.com/portadas/{{tag}}.jpg",
      "anio_estreno": 2024,
      "genero_id": {{generoId}},
      "director_id": {{directorId}},
      "productora_id": {{productoraId}},
      "tipo_id": {{tipoId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("No admite inactivos", () => pm.expect(pm.response.json().error).to.include("Activo"));
    language: text/javascript
order: 14000
