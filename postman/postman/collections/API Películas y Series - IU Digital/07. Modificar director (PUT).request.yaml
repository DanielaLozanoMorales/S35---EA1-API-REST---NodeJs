$kind: http-request
url: "{{baseUrl}}/api/directores/{{directorId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "Director actualizado {{tag}}",
      "estado": "Activo"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
