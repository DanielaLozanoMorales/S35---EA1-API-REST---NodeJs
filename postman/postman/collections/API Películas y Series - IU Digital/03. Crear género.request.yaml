$kind: http-request
url: "{{baseUrl}}/api/generos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Comedia {{tag}}",
      "estado": "Activo",
      "descripcion": "Género de prueba"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("nuevoGeneroId", pm.response.json().datos.id);
    language: text/javascript
order: 3000
