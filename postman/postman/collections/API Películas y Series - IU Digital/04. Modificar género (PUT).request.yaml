$kind: http-request
url: "{{baseUrl}}/api/generos/{{nuevoGeneroId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Comedia {{tag}}",
      "estado": "Activo",
      "descripcion": "Comedia y humor"
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
