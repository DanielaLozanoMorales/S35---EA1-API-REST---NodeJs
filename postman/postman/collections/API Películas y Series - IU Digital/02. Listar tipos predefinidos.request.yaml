$kind: http-request
url: "{{baseUrl}}/api/tipos"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set("tipoId", pm.response.json().datos.find(x => x.nombre === "Película").id);
    language: text/javascript
order: 2000
